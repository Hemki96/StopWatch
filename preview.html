<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Mobile Vorschau</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #1b2430;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      .rahmen {
        width: 390px;
        height: 844px;
        transform: scale(0.8);
        transform-origin: center;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        background: #070c15;
      }
    </style>
  </head>
  <body>
    <div class="rahmen">
      <iframe id="phone" src="/" title="Beckenrand mobil"></iframe>
    </div>
  </body>
</html>
