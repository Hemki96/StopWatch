name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions sind auf Commit-SHAs gepinnt; die Kommentare nennen die Version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Laufzeit-Abhängigkeiten müssen frei von bekannten Schwachstellen sein.
      # Entwicklungs-Werkzeuge (Workbox/rollup) werden getrennt bewertet.
      - run: npm audit --omit=dev
      - run: npm run verify
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # `verify` hat `dist` bereits gebaut; der Produktions-Webserver soll
          # nicht ein zweites Mal bauen.
          PLAYWRIGHT_SKIP_BUILD: '1'
